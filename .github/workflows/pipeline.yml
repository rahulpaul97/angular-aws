# Name shown in GitHub Actions UI
name: Deploy Angular to EC2

# Trigger: run this workflow on every push to main branch
on:
  push:
    branches: [first-project]

jobs:
  deploy:
    # Runner where the job will execute
    runs-on: ubuntu-latest

    steps:
      # Checkout your GitHub repo code into the runner
      - name: Checkout
        uses: actions/checkout@v4

      # Install Node.js (needed to build Angular)
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22 # Use Node 24
          # cache: npm # Cache ~/.npm to speed up future runs

      #  Install exact dependencies from package-lock.json
      - name: Install dependencies
        run: npm install

      #  Build Angular app in production mode
      # Output goes to dist/<app-name>/
      - name: Build Angular
        run: npm run build

      #  Copy built files from runner → EC2 server using SCP over SSH
      - name: Copy files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.EC2_HOST }} # EC2 public IP / domain
          username: ${{ vars.EC2_USER }} # Linux user on EC2 (e.g., ubuntu)
          key: ${{ secrets.EC2_SSH_KEY }} # Private SSH key from secrets
          source: "dist/first-project/browser/**" # What to copy from runner
          target: "/home/${{ vars.EC2_USER }}/deploy" # Temp folder on EC2
          strip_components: 3

      #  SSH into EC2 and deploy files to Nginx web root
      - name: Deploy & reload nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.EC2_HOST }}
          username: ${{ vars.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Ensure temp deploy directory exists
            mkdir -p /home/${{ vars.EC2_USER }}/deploy

            # Remove old files from Nginx root
            sudo rm -rf ${{ vars.EC2_PATH }}/*

            # Copy new build files into Nginx root
            sudo cp -r /home/${{ vars.EC2_USER }}/deploy/* ${{ vars.EC2_PATH }}/

            # Reload Nginx to serve new files (no downtime)
            sudo systemctl reload nginx
