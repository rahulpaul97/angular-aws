name: Angular CI/CD to EC2

on:
  push:
    branches: ["S3-deployment"]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

        # Install Node.js (needed to build Angular)
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22 # Use Node 24
          # cache: npm # Cache ~/.npm to speed up future runs

      #  Install exact dependencies from package-lock.json
      - name: Install dependencies
        run: npm ci

      #  Build Angular app in production mode
      # Output goes to dist/<app-name>/
      - name: Build Angular
        run: npm run build

      #  OIDC Auth
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/Github-oidc-deploy-rule
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy to S3
        run: |
          aws s3 sync dist/second-project/browser/ s3://angular-app-370835 \
            --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E13640NGLVQI5L \
            --paths "/index.html"
