# Name shown in GitHub Actions UI
name: Deploy Angular to EC2

# Trigger: run this workflow on every push to main branch
on:
    push:
        branches: [first-project]

jobs:
    deploy:
        # Runner where the job will execute
        runs-on: ubuntu-latest

        steps:
            # Checkout your GitHub repo code into the runner
            - name: Checkout
              uses: actions/checkout@v4

            # Install Node.js (needed to build Angular)
            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22 # Use Node 24
                  # cache: npm # Cache ~/.npm to speed up future runs

            #  Install exact dependencies from package-lock.json
            - name: Install dependencies
              run: npm ci

            #  Build Angular app in production mode
            # Output goes to dist/<app-name>/
            - name: Build Angular
              run: npm run build

            # Setup SSH
            - name: Setup SSH
              run: |
                  sudo apt-get update
                  sudo apt-get install -y openssh-client

                  mkdir -p ~/.ssh
                  chmod 700 ~/.ssh

                  eval "$(ssh-agent -s)"

                  echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_ed25519
                  chmod 600 ~/.ssh/id_ed25519

                  printf "%s\n" "${{ secrets.EC2_SSH_PASSPHRASE }}" | ssh-add ~/.ssh/id_ed25519

                  ssh-keyscan -H ${{ vars.EC2_HOST }} >> ~/.ssh/known_hosts

            #  Copy built files from runner → EC2 server using SCP over SSH
            - name: Copy files to EC2
              run: |
                  scp -r dist/first-project/browser* \ ${{ vars.EC2_USER }}@${{ vars.EC2_HOST }}:/home/${{ vars.EC2_USER }}/deploy-first-app/

            - name: Deploy & reload nginx
              run: |
                  ssh ${{ vars.EC2_USER }}@${{ vars.EC2_HOST }} << 'EOF'
                      set -e

                      sudo rm -rf ${{ vars.EC2_PATH }}/*
                      sudo cp -r /home/${USER}/deploy-first-app/* ${{ vars.EC2_PATH }}/
                      sudo rm -rf /home/${{ vars.EC2_USER }}/deploy-first-app
                      sudo systemctl reload nginx
                  EOF